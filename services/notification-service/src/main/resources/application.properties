spring.application.name=notification-service

server.port=8084

# ==== DATABASE ====
spring.datasource.url=jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5436}/${NOTIFICATION_DB_NAME:notification_db}
spring.datasource.username=${NOTIFICATION_DB_USER:notification_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:notification_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==== JWT (validation only, token is issued by auth-service) ====
jwt.secret=${JWT_SECRET}

# ==== KAFKA ====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

kafka.topic.user-registered=user-registered-topic
kafka.topic.order-created=order-created-topic

# ==== MAIL ====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:no-reply@electronics-shop.local}
app.shop-name=VOLT
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==== LOGGING ====
logging.level.com.sorokaandriy.notification_service=INFO
