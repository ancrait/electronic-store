spring.application.name=product-service

server.port=8082

# ==== DATABASE ====
spring.datasource.url=jdbc:postgresql://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:5434}/${PRODUCT_DB_NAME:product_db}
spring.datasource.username=${PRODUCT_DB_USER:product_user}
spring.datasource.password=${PRODUCT_DB_PASSWORD:product_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==== JWT (validation only, token is issued by auth-service) ====
jwt.secret=${JWT_SECRET}

# ==== KAFKA ====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

kafka.topic.order-created=order-created-topic

# ==== CORS ====
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==== LOGGING ====
logging.level.com.sorokaandriy.product_service=INFO
